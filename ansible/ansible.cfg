# Ansible configuration for the SSH host-certificate automation.
# Productionised version of Jan-Piet Mens' host-key/cert pattern
# (see ../docs/technical-reference.md section 10) for the dual-CA +
# Cosmian KMS setup.
[defaults]
inventory = inventory.ini
roles_path = roles
# Host keys are managed by SSH certificates, so the controller does not
# need to maintain a known_hosts cache for the lab nodes.
host_key_checking = False
# Make output readable when reviewing certificate signing runs.
stdout_callback = yaml
# gather_facts is required: the principals expression needs ansible_fqdn
# and ansible_all_ipv4_addresses (see roles/ssh_host_cert/defaults/main.yml).
gathering = smart
interpreter_python = auto_silent

[privilege_escalation]
become = False

[ssh_connection]
pipelining = True
