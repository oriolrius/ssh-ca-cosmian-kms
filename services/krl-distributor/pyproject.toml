[project]
name = "krl-distributor"
version = "0.0.0"
description = "Stateless, encrypted SSH KRL distribution service backed by Cosmian KMS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Oriol Rius" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Single-module app — ship app.py directly.
include = ["app.py"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["test_app.py"]
