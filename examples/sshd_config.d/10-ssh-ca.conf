# /etc/ssh/sshd_config.d/10-ssh-ca.conf
# OpenSSH Certificate Authority — server drop-in configuration.
#
# The server presents a host certificate (eliminates TOFU) and trusts the
# User CA to authenticate users (eliminates per-host authorized_keys).
# All values below are disposable lab examples.

# Host certificate presented to clients during key exchange.
HostKey /etc/ssh/ssh_host_ed25519_key
HostCertificate /etc/ssh/ssh_host_ed25519_key-cert.pub

# Trust the User CA public key to sign user certificates.
TrustedUserCAKeys /etc/ssh/ssh-user-ca.pub

# Map certificate principals to local accounts (role-based access control).
AuthorizedPrincipalsFile /etc/ssh/auth_principals/%u

# Key Revocation List. sshd re-reads this file on every auth attempt,
# so updates take effect with no restart.
RevokedKeys /etc/ssh/revoked_keys

# Recommended hardening once certificates are in place:
# PasswordAuthentication no
# KbdInteractiveAuthentication no
