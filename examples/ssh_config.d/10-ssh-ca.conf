# ~/.ssh/config  (or /etc/ssh/ssh_config.d/10-ssh-ca.conf)
# Client-side certificate usage. The certificate is auto-discovered next to
# the private key (id_ed25519 -> id_ed25519-cert.pub); CertificateFile is
# shown for clarity.
Host *.example.com
    IdentityFile ~/.ssh/id_ed25519
    CertificateFile ~/.ssh/id_ed25519-cert.pub
    IdentitiesOnly yes
